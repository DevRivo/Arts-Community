version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: art_community_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_change_me
      POSTGRES_DB: art_community
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
